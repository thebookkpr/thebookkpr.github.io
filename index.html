<!DOCTYPE html>
<!-- PROJECT: Book Keeper — Website (The Book Keeper)
     FILE: index.html · V1.1 · Part 1 of 1
     LOCATION: thebookkpr.github.io/index.html (repository root)
     V1.1: Title and lore start hidden (scene.js shows them after
           5 seconds, hides them after 20 seconds or on any tap).
           Added pollen, drifting leaves, a moth, a tap-magic layer,
           a quiet Sound button, and js/audio.js.
     V1.0: New beginning. One painting (mobile and desktop), living
           effects, a tappable round green door, and a visible link
           into the library at /stories/. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#120a07">
  <meta name="description" content="Keeper of storybook worlds. Cozy games, little lives, and quiet adventures, kept with care.">

  <title>The Book Keeper</title>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/effects.css">

  <!-- If scripts are off, the title simply stays visible -->
  <noscript>
    <style>.threshold-header { opacity: 1; visibility: visible; }</style>
  </noscript>

  <script src="./js/audio.js" defer></script>
  <script src="./js/scene.js" defer></script>
</head>
<body>

  <!-- Scene: the painting, its living light, and the door -->
  <div class="scene">
    <div class="scene-art">

      <!-- Painting: mobile by default, desktop on wide screens -->
      <picture>
        <source media="(min-width: 900px) and (orientation: landscape)"
                srcset="./images/thebookkeeper-desktop.jpg">
        <img class="scene-img"
             src="./images/thebookkeeper-bg.jpg"
             alt="A round green door set into a hillside beneath ancient roots, lit by lanterns at dusk."
             decoding="async">
      </picture>

      <!-- Mist and sky -->
      <div class="sky-shimmer" aria-hidden="true"></div>
      <div class="haze" aria-hidden="true"></div>

      <!-- Light -->
      <div class="door-glow" aria-hidden="true"></div>
      <div class="window-glow" aria-hidden="true"></div>
      <div class="lantern lantern-1" aria-hidden="true"></div>
      <div class="lantern lantern-2" aria-hidden="true"></div>
      <div class="lantern lantern-3" aria-hidden="true"></div>
      <div class="lantern lantern-4" aria-hidden="true"></div>
      <div class="lantern lantern-5" aria-hidden="true"></div>

      <!-- Tiny lights -->
      <div class="fireflies" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="gold-dust" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <!-- Floating life: pollen and drifting leaves -->
      <div class="pollen" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span>
      </div>
      <div class="leaves" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <!-- A moth passing by (scene.js sends it every 20 seconds) -->
      <div class="moth" aria-hidden="true"><span></span></div>

      <!-- The round green door: tappable -->
      <a class="door-link" href="./stories/"
         aria-label="Enter the Library through the round green door"></a>

    </div>
  </div>

  <!-- Tap magic: scene.js places little lights here -->
  <div class="tap-magic" aria-hidden="true"></div>

  <!-- Title: appears after 5 seconds, leaves after 20 or on a tap -->
  <header class="threshold-header">
    <h1>The Book Keeper</h1>
    <p class="threshold-tagline">Keeper of storybook worlds.</p>
    <p class="threshold-lore">The lanterns are lit, and the kettle is still warm.</p>
  </header>

  <!-- Entrance: sits on the path -->
  <main>
    <a class="enter-library" href="./stories/">Enter the Library</a>
  </main>

  <!-- Sound: off until the visitor chooses (audio.js) -->
  <button class="sound-toggle" type="button" aria-pressed="false"
          aria-label="Turn sound on">Sound off</button>

</body>
</html>
