<!DOCTYPE html>
<!-- thebookkpr.github.io front door — index.html V1.3 · Part 1 of 1
     V1.3: painted scene layer added, with effects (lanterns, door glow, fireflies, dust, haze) and a tappable door.
     V1.2: inline styles replaced by css/variables.css, css/base.css and css/effects.css.
     V1.1: instant redirect removed; small landing page with a link into the library.
     V1.0: instant redirect to games/.
     Lives at the root of the thebookkpr.github.io repository. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#120a07">
  <meta name="description" content="Storybook worlds, kept with care.">

  <title>The Book Keeper</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/effects.css">
</head>
<body>

  <!-- Scene: the painting, with its effects and the door link -->
  <div class="scene">
    <div class="scene-art">

      <!-- Sky and mist -->
      <div class="sky-shimmer"></div>
      <div class="haze"></div>

      <!-- Light -->
      <div class="door-glow"></div>
      <div class="lantern lantern-1"></div>
      <div class="lantern lantern-2"></div>
      <div class="lantern lantern-3"></div>

      <!-- Tiny lights -->
      <div class="fireflies" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="gold-dust" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- The round green door, tappable -->
      <a class="door-link" href="./stories/" aria-label="Enter the Library through the round green door"></a>

    </div>
  </div>

  <!-- Title: sits in the sky -->
  <header class="threshold-header">
    <h1>The Book Keeper</h1>
    <p class="threshold-tagline">Storybook worlds, kept with care.</p>
  </header>

  <!-- Entrance: sits on the path -->
  <main>
    <a class="enter-library" href="./stories/">Enter the Library</a>
  </main>

</body>
</html>
